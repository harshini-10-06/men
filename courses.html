<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
        }
        h1 {
            text-align: center;
        }
        .course-box {
            background: white;
            padding: 20px;
            margin: 15px auto;
            width: 70%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        button {
            padding: 8px 15px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Course Management</h1>

<div class="course-box">
    <h3>Web Development</h3>
    <button>Edit</button>
    <button>Delete</button>
</div>

<div class="course-box">
    <h3>Database Systems</h3>
    <button>Edit</button>
    <button>Delete</button>
</div>

<div class="course-box">
    <h3>Machine Learning</h3>
    <button>Edit</button>
    <button>Delete</button>
</div>

</body>
</html>
