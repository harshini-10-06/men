<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instructor Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
        }
        h1 {
            text-align: center;
        }
        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            padding: 20px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }
        .links {
            background: white;
            margin: 40px auto;
            padding: 20px;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }
        a {
            display: inline-block;
            margin: 10px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
        }
        a:hover {
            color: #2980b9;
        }
    </style>
</head>
<body>

<h1>Instructor Dashboard</h1>

<div class="cards">
    <div class="card">
        <h2>Courses</h2>
        <p>5 Created</p>
    </div>
    <div class="card">
        <h2>Students</h2>
        <p>120 Enrolled</p>
    </div>
    <div class="card">
        <h2>Quizzes</h2>
        <p>35 Created</p>
    </div>
</div>

<div class="links">
    <h2>Instructor Actions</h2>
    <a href="courses.html">Course Management</a><br>
    <a href="index.html">Back to Home</a>
</div>

</body>
</html>
