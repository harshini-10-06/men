<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
        }
        h1 {
            text-align: center;
        }
        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            padding: 20px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }
        .courses {
            background: white;
            margin: 40px auto;
            padding: 20px;
            width: 70%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<h1>Student Dashboard</h1>

<div class="cards">
    <div class="card">
        <h2>Courses</h2>
        <p>3 Enrolled</p>
    </div>
    <div class="card">
        <h2>Quizzes</h2>
        <p>2 Pending</p>
    </div>
    <div class="card">
        <h2>Progress</h2>
        <p>75%</p>
    </div>
</div>

<div class="courses">
    <h2>My Courses</h2>
    <ul>
        <li>Web Development</li>
        <li>Database Systems</li>
        <li>Machine Learning</li>
    </ul>
</div>

</body>
</html>
